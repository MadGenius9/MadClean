name: Windows build and validation
on:
  push:
    branches: [main, feat/phase-one-foundation, recovery/validated-20261112]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_package:
        description: Explicitly prepare a distribution ZIP (leave off during roadmap development)
        required: false
        default: false
        type: boolean
concurrency:
  group: madclean-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      sdk: ${{ steps.sdk.outcome }}
      restore: ${{ steps.restore.outcome }}
      build: ${{ steps.build.outcome }}
      publisher_tests: ${{ steps.publisher_tests.outcome }}
      core_tests: ${{ steps.core_tests.outcome }}
      publish: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: sdk
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked dependencies
        id: restore
        run: python tools/ci_command.py restore -- dotnet restore MadClean.sln --locked-mode
      - name: Build
        id: build
        run: python tools/ci_command.py build -- dotnet build MadClean.sln -c Release --no-restore
      - name: CI evidence-integrity boundary tests
        id: publisher_tests
        run: python tools/ci_command.py publisher-tests -- python -m unittest discover -s tools/tests -v
      - name: Core boundary tests on Windows
        id: core_tests
        run: python tools/ci_command.py core-tests -- dotnet test tests/MadClean.Tests -c Release --no-build --logger "trx;LogFileName=core-windows.trx" --results-directory artifacts/test-results
      - name: Preserve development test results even on failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-core-test-results
          path: artifacts/test-results/core-windows.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Windows x64 executable (not a UI runtime test)
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_package == true
        id: publish
        run: python tools/ci_command.py publish -- dotnet publish src/MadClean.App/MadClean.App.csproj -c Release -r win-x64 --self-contained true -p:MadCleanPackage=true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RestoreLockedMode=true -o artifacts/win-x64
      - name: Preserve bounded development command logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-ci-command-logs
          path: artifacts/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package and hash
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_package == true
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/win-x64/README.md
          Copy-Item docs artifacts/win-x64/docs -Recurse
          $hash = (Get-FileHash artifacts/win-x64/MadClean.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MadClean.exe" | Set-Content artifacts/win-x64/SHA256SUMS.txt
          @("Source commit: $env:GITHUB_SHA", "Platform: Windows x64; self-contained; unsigned", "Phase one: read-only discovery; system-changing actions queued", "GUI and live provider checks require the manual validation matrix") | Set-Content artifacts/win-x64/BUILD-INFO.txt
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/MadClean-win-x64.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_package == true && success()
        with:
          name: MadClean-win-x64-and-test-results
          path: |
            artifacts/MadClean-win-x64.zip
            artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

  windows-verification:
    needs: build-test-package
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked Windows validation dependencies
        run: python tools/ci_command.py restore -- dotnet restore MadClean.sln --locked-mode
      - name: Build the development-only Windows harness
        run: python tools/ci_command.py build -- dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Observe current neutral repair-review controls (no providers or actions)
        continue-on-error: true
        run: python tools/ci_command.py local-repair-review -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --local-repair-review-validation
      - name: Observe bounded local Windows Update history (no online search or actions)
        continue-on-error: true
        run: python tools/ci_command.py local-update-history -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --local-update-history-validation
      - name: Record installed SDK journal API reference fragments (metadata only)
        continue-on-error: true
        run: python tools/ci_command.py sdk-journal-reference -- python tools/inspect_journal_sdk.py
      - name: Compile WER ABI assertions against the installed Windows SDK (no execution)
        run: python tools/ci_command.py native-abi -- python tools/compile_wer_sdk.py
      - name: Compile development-only SDK shortcut control DLL (not packaged)
        run: python tools/ci_command.py shortcut-control -- python tools/compile_shortcut_control.py
      - name: Observe existing read-only update providers on the disposable runner
        continue-on-error: true
        timeout-minutes: 5
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py update-discovery -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --update-discovery
      - name: Qualify actual app update and selected online catalog-metadata controls
        continue-on-error: true
        timeout-minutes: 5
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py app-update-ui -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --app-update-ui-validation
      - name: Prepare owned self-contained SDK harness (no distribution)
        run: python tools/prepare_structured_winget_publish.py
      - name: Observe actual published structured SDK query
        continue-on-error: true
        timeout-minutes: 5
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py structured-winget-published -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --structured-winget-published-parent
      - name: Prepare owned self-contained executable for startup validation (no distribution)
        run: python tools/prepare_published_startup.py
      - name: Capture real WPF content and exercise isolated native fixtures
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py smoke -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build
      - name: Preserve bounded native harness command logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-native-command-logs
          path: artifacts/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve scoped Windows validation evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-Windows-validation
          path: artifacts/windows-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve separate local UI, history and SDK observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-local-observations-and-sdk-reference-${{ github.run_attempt }}
          path: |
            artifacts/local-repair-review-validation/
            artifacts/local-update-history-validation/
            artifacts/sdk-journal-reference/
          if-no-files-found: warn
          retention-days: 14

  windows-msi-request:
    needs: build-test-package
    if: >-
      ${{ success() && github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked qualification dependencies
        run: dotnet restore MadClean.sln --locked-mode
      - name: Build the separate owned MSI qualification mode
        run: dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Qualify visible uninstall for one fresh inert owned product only
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
          MADCLEAN_MSI_REQUEST_VALIDATION: '1'
        run: dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --msi-request-validation
      - name: Preserve only fixed source-bound MSI qualification facts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-MSI-request-validation
          path: artifacts/msi-request-validation/report.json
          if-no-files-found: warn
          retention-days: 14

  windows-component-store-status:
    needs: build-test-package
    if: >-
      ${{ success() && github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked recorded-status qualification dependencies
        run: dotnet restore MadClean.sln --locked-mode
      - name: Build the separate recorded component-store flag mode
        run: dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Qualify one explicit inbox non-repair CheckHealth request
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
          MADCLEAN_COMPONENT_STORE_STATUS_VALIDATION: '1'
        run: dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --component-store-status-validation
      - name: Preserve only source-bound component-store flag facts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-Component-store-status-validation
          path: artifacts/component-store-status-validation/report.json
          if-no-files-found: warn
          retention-days: 14

  windows-component-store-scan:
    needs: build-test-package
    if: >-
      ${{ success() && github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked fresh-scan qualification dependencies
        run: dotnet restore MadClean.sln --locked-mode
      - name: Build the separate fresh component-store scan mode
        run: dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Qualify an explicit inbox non-repair ScanHealth request
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
          MADCLEAN_COMPONENT_STORE_SCAN_VALIDATION: '1'
        run: dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --component-store-scan-validation
      - name: Preserve only source-bound component-store scan facts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-Component-store-scan-validation
          path: artifacts/component-store-scan-validation/report.json
          if-no-files-found: warn
          retention-days: 14

  windows-app-update-published:
    needs: build-test-package
    if: >-
      ${{ github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked development dependencies
        run: python tools/ci_command.py restore -- dotnet restore MadClean.sln --locked-mode
      - name: Build the development observer
        run: python tools/ci_command.py build -- dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Prepare the owned published MadClean app (no distribution)
        run: python tools/prepare_published_startup.py
      - name: Query updates using the actual published app controls
        timeout-minutes: 5
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py published-app-updates -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --published-app-update-validation
      - name: Preserve fixed published-app query observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-published-app-update-validation
          path: artifacts/published-app-update-validation/report.json
          if-no-files-found: warn
          retention-days: 14

  windows-sfc-client:
    needs: build-test-package
    if: >-
      ${{ success() && github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked client qualification dependencies
        run: dotnet restore MadClean.sln --locked-mode
      - name: Build the separate non-repair SFC client mode
        run: dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Observe one fixed SFC verify-only client (no repair or integrity verdict)
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
          MADCLEAN_SFC_CLIENT_VALIDATION: '1'
        run: dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build -- --sfc-client-validation
      - name: Preserve fixed client lifecycle observations only
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-SFC-client-validation
          path: artifacts/sfc-client-validation/report.json
          if-no-files-found: warn
          retention-days: 14

  publish-verification:
    needs: [build-test-package, windows-verification, windows-msi-request, windows-component-store-status, windows-component-store-scan, windows-app-update-published, windows-sfc-client]
    if: >-
      ${{ always() && github.repository == 'MadGenius9/MadClean' &&
          (github.ref == 'refs/heads/feat/phase-one-foundation' ||
           github.ref == 'refs/heads/recovery/validated-20261112') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the publisher from this exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out only the dedicated verification branch
        uses: actions/checkout@v7
        with:
          ref: madclean-verification
          path: verification
      - name: Retrieve this run's scoped Windows evidence
        id: windows_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-Windows-validation
          path: downloaded
          digest-mismatch: error
      - name: Retrieve this run's portable test evidence
        id: core_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-core-test-results
          path: downloaded-core
          digest-mismatch: error
      - name: Retrieve this run's bounded compiler/test diagnostics
        id: command_logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-ci-command-logs
          path: downloaded-logs
          digest-mismatch: error
      - name: Retrieve this run's bounded native harness diagnostics
        id: native_logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-native-command-logs
          path: downloaded-native-logs
          digest-mismatch: error
      - name: Retrieve this run's separate owned MSI qualification facts
        id: msi_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-MSI-request-validation
          path: downloaded-msi
          digest-mismatch: error
      - name: Retrieve this run's separate component-store status facts
        id: component_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-Component-store-status-validation
          path: downloaded-component-store
          digest-mismatch: error
      - name: Retrieve this run's separate fresh component-store scan facts
        id: scan_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-Component-store-scan-validation
          path: downloaded-component-scan
          digest-mismatch: error
      - name: Retrieve this run's published MadClean update-query facts
        id: published_app_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-published-app-update-validation
          path: downloaded-published-app
          digest-mismatch: error
      - name: Retrieve this run's separate SFC client lifecycle facts
        id: sfc_client_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-SFC-client-validation
          path: downloaded-sfc-client
          digest-mismatch: error
      - name: Retrieve this run's separate local observations and SDK references
        id: local_observations
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-local-observations-and-sdk-reference-${{ github.run_attempt }}
          path: downloaded-local
          digest-mismatch: error
      - name: Validate and publish only fixed, source-bound development evidence
        env:
          MADCLEAN_LOCAL_OBSERVATION_DOWNLOAD_RESULT: ${{ steps.local_observations.outcome }}
          MADCLEAN_SFC_CLIENT_RESULT: ${{ needs.windows-sfc-client.result }}
          MADCLEAN_SFC_CLIENT_DOWNLOAD_RESULT: ${{ steps.sfc_client_evidence.outcome }}
          MADCLEAN_PUBLISHED_APP_RESULT: ${{ needs.windows-app-update-published.result }}
          MADCLEAN_PUBLISHED_APP_DOWNLOAD_RESULT: ${{ steps.published_app_evidence.outcome }}
          MADCLEAN_SCAN_RESULT: ${{ needs.windows-component-store-scan.result }}
          MADCLEAN_SCAN_DOWNLOAD_RESULT: ${{ steps.scan_evidence.outcome }}
          MADCLEAN_COMPONENT_RESULT: ${{ needs.windows-component-store-status.result }}
          MADCLEAN_COMPONENT_DOWNLOAD_RESULT: ${{ steps.component_evidence.outcome }}
          MADCLEAN_MSI_RESULT: ${{ needs.windows-msi-request.result }}
          MADCLEAN_MSI_DOWNLOAD_RESULT: ${{ steps.msi_evidence.outcome }}
          MADCLEAN_BUILD_RESULT: ${{ needs.build-test-package.result }}
          MADCLEAN_VERIFICATION_RESULT: ${{ needs.windows-verification.result }}
          MADCLEAN_REPORT_DOWNLOAD_RESULT: ${{ steps.windows_evidence.outcome }}
          MADCLEAN_CORE_DOWNLOAD_RESULT: ${{ steps.core_evidence.outcome }}
          MADCLEAN_NATIVE_LOG_DOWNLOAD_RESULT: ${{ steps.native_logs.outcome }}
          MADCLEAN_LOG_DOWNLOAD_RESULT: ${{ steps.command_logs.outcome }}
          MADCLEAN_STAGE_SDK: ${{ needs.build-test-package.outputs.sdk }}
          MADCLEAN_STAGE_RESTORE: ${{ needs.build-test-package.outputs.restore }}
          MADCLEAN_STAGE_BUILD: ${{ needs.build-test-package.outputs.build }}
          MADCLEAN_STAGE_PUBLISHER_TESTS: ${{ needs.build-test-package.outputs.publisher_tests }}
          MADCLEAN_STAGE_CORE_TESTS: ${{ needs.build-test-package.outputs.core_tests }}
          MADCLEAN_STAGE_PUBLISH: ${{ needs.build-test-package.outputs.publish }}
        run: >-
          python3 source/tools/publish_windows_verification.py
          --verification-checkout verification
          --downloaded-reports downloaded
          --core-test-results downloaded-core
          --command-logs downloaded-logs
          --native-command-logs downloaded-native-logs
          --build-result "$MADCLEAN_BUILD_RESULT"
          --verification-result "$MADCLEAN_VERIFICATION_RESULT"
          --report-download-result "$MADCLEAN_REPORT_DOWNLOAD_RESULT"
          --core-download-result "$MADCLEAN_CORE_DOWNLOAD_RESULT"
          --log-download-result "$MADCLEAN_LOG_DOWNLOAD_RESULT"
          --native-log-download-result "$MADCLEAN_NATIVE_LOG_DOWNLOAD_RESULT"
          --msi-request-reports downloaded-msi
          --msi-download-result "$MADCLEAN_MSI_DOWNLOAD_RESULT"
          --msi-result "$MADCLEAN_MSI_RESULT"
          --component-store-reports downloaded-component-store
          --component-store-download-result "$MADCLEAN_COMPONENT_DOWNLOAD_RESULT"
          --component-store-result "$MADCLEAN_COMPONENT_RESULT"
          --component-scan-reports downloaded-component-scan
          --component-scan-download-result "$MADCLEAN_SCAN_DOWNLOAD_RESULT"
          --component-scan-result "$MADCLEAN_SCAN_RESULT"
          --published-app-update-reports downloaded-published-app
          --published-app-update-download-result "$MADCLEAN_PUBLISHED_APP_DOWNLOAD_RESULT"
          --published-app-update-result "$MADCLEAN_PUBLISHED_APP_RESULT"
          --sfc-client-reports downloaded-sfc-client
          --sfc-client-download-result "$MADCLEAN_SFC_CLIENT_DOWNLOAD_RESULT"
          --sfc-client-result "$MADCLEAN_SFC_CLIENT_RESULT"
          --local-observation-reports downloaded-local
          --local-observation-download-result "$MADCLEAN_LOCAL_OBSERVATION_DOWNLOAD_RESULT"
