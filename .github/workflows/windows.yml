name: Windows build and package
on:
  push:
    branches: [main, feat/phase-one-foundation]
  pull_request:
  workflow_dispatch:
concurrency:
  group: madclean-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      sdk: ${{ steps.sdk.outcome }}
      restore: ${{ steps.restore.outcome }}
      build: ${{ steps.build.outcome }}
      publisher_tests: ${{ steps.publisher_tests.outcome }}
      core_tests: ${{ steps.core_tests.outcome }}
      publish: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: sdk
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked dependencies
        id: restore
        run: python tools/ci_command.py restore -- dotnet restore MadClean.sln --locked-mode
      - name: Build
        id: build
        run: python tools/ci_command.py build -- dotnet build MadClean.sln -c Release --no-restore
      - name: CI evidence-integrity boundary tests
        id: publisher_tests
        run: python tools/ci_command.py publisher-tests -- python -m unittest discover -s tools/tests -v
      - name: Core boundary tests on Windows
        id: core_tests
        run: python tools/ci_command.py core-tests -- dotnet test tests/MadClean.Tests -c Release --no-build --logger "trx;LogFileName=core-windows.trx" --results-directory artifacts/test-results
      - name: Preserve development test results even on failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-core-test-results
          path: artifacts/test-results/core-windows.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Windows x64 executable (not a UI runtime test)
        id: publish
        run: python tools/ci_command.py publish -- dotnet publish src/MadClean.App/MadClean.App.csproj -c Release -r win-x64 --self-contained true -p:MadCleanPackage=true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RestoreLockedMode=true -o artifacts/win-x64
      - name: Preserve bounded development command logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-ci-command-logs
          path: artifacts/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package and hash
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/win-x64/README.md
          Copy-Item docs artifacts/win-x64/docs -Recurse
          $hash = (Get-FileHash artifacts/win-x64/MadClean.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MadClean.exe" | Set-Content artifacts/win-x64/SHA256SUMS.txt
          @("Source commit: $env:GITHUB_SHA", "Platform: Windows x64; self-contained; unsigned", "Phase one: read-only discovery; system-changing actions queued", "GUI and live provider checks require the manual validation matrix") | Set-Content artifacts/win-x64/BUILD-INFO.txt
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/MadClean-win-x64.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-win-x64-and-test-results
          path: |
            artifacts/MadClean-win-x64.zip
            artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

  windows-verification:
    needs: build-test-package
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked Windows validation dependencies
        run: python tools/ci_command.py restore -- dotnet restore MadClean.sln --locked-mode
      - name: Build the development-only Windows harness
        run: python tools/ci_command.py build -- dotnet build tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-restore
      - name: Capture real WPF content and exercise isolated native fixtures
        env:
          MADCLEAN_WINDOWS_VALIDATION: '1'
        run: python tools/ci_command.py smoke -- dotnet run --project tools/MadClean.WindowsSmoke/MadClean.WindowsSmoke.csproj -c Release --no-build
      - name: Preserve bounded native harness command logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-native-command-logs
          path: artifacts/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve scoped Windows validation evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MadClean-Windows-validation
          path: artifacts/windows-validation/
          if-no-files-found: warn
          retention-days: 14

  publish-verification:
    needs: [build-test-package, windows-verification]
    if: >-
      ${{ always() && github.repository == 'MadGenius9/MadClean' &&
          github.ref == 'refs/heads/feat/phase-one-foundation' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the publisher from this exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out only the dedicated private verification branch
        uses: actions/checkout@v7
        with:
          ref: madclean-verification
          path: verification
      - name: Retrieve this run's scoped Windows evidence
        id: windows_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-Windows-validation
          path: downloaded
          digest-mismatch: error
      - name: Retrieve this run's portable test evidence
        id: core_evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-core-test-results
          path: downloaded-core
          digest-mismatch: error
      - name: Retrieve this run's bounded compiler/test diagnostics
        id: command_logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-ci-command-logs
          path: downloaded-logs
          digest-mismatch: error
      - name: Retrieve this run's bounded native harness diagnostics
        id: native_logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: MadClean-native-command-logs
          path: downloaded-native-logs
          digest-mismatch: error
      - name: Validate and publish only fixed, source-bound development evidence
        env:
          MADCLEAN_BUILD_RESULT: ${{ needs.build-test-package.result }}
          MADCLEAN_VERIFICATION_RESULT: ${{ needs.windows-verification.result }}
          MADCLEAN_REPORT_DOWNLOAD_RESULT: ${{ steps.windows_evidence.outcome }}
          MADCLEAN_CORE_DOWNLOAD_RESULT: ${{ steps.core_evidence.outcome }}
          MADCLEAN_NATIVE_LOG_DOWNLOAD_RESULT: ${{ steps.native_logs.outcome }}
          MADCLEAN_LOG_DOWNLOAD_RESULT: ${{ steps.command_logs.outcome }}
          MADCLEAN_STAGE_SDK: ${{ needs.build-test-package.outputs.sdk }}
          MADCLEAN_STAGE_RESTORE: ${{ needs.build-test-package.outputs.restore }}
          MADCLEAN_STAGE_BUILD: ${{ needs.build-test-package.outputs.build }}
          MADCLEAN_STAGE_PUBLISHER_TESTS: ${{ needs.build-test-package.outputs.publisher_tests }}
          MADCLEAN_STAGE_CORE_TESTS: ${{ needs.build-test-package.outputs.core_tests }}
          MADCLEAN_STAGE_PUBLISH: ${{ needs.build-test-package.outputs.publish }}
        run: >-
          python3 source/tools/publish_windows_verification.py
          --verification-checkout verification
          --downloaded-reports downloaded
          --core-test-results downloaded-core
          --command-logs downloaded-logs
          --native-command-logs downloaded-native-logs
          --build-result "$MADCLEAN_BUILD_RESULT"
          --verification-result "$MADCLEAN_VERIFICATION_RESULT"
          --report-download-result "$MADCLEAN_REPORT_DOWNLOAD_RESULT"
          --core-download-result "$MADCLEAN_CORE_DOWNLOAD_RESULT"
          --log-download-result "$MADCLEAN_LOG_DOWNLOAD_RESULT"
          --native-log-download-result "$MADCLEAN_NATIVE_LOG_DOWNLOAD_RESULT"
